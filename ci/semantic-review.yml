# Semantic Review — GitHub Action (template)
#
# Copy to `.github/workflows/semantic-review.yml` in the target repo.
# Posts a sticky PR comment: what changed, how it flows, where to look, and what's unknown.
# Assumes the extractor is vendored at `tools/semantic-review/` in the repo (pure stdlib, no
# deps). To vendor: copy the `extractor/`, `diff_pr.py`, `ci/` from this project there.

name: Semantic Review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write        # needed to post the comment

jobs:
  semantic-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR (full history so both sides are available)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate semantic review (md + json + html)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # enforce a confirmed invariant corpus if the repo ships one
          CORPUS=""
          if [ -f semantic-review-invariants.json ]; then
            CORPUS="--invariants semantic-review-invariants.json"
          fi
          python tools/semantic-review/diff_pr.py . \
            --base "$BASE" --head "$HEAD" \
            --out pr_review.md --json pr_review.json --html pr_review.html $CORPUS
          cat pr_review.md >> "$GITHUB_STEP_SUMMARY"   # also show in the run summary

      - name: Post sticky PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python tools/semantic-review/ci/post_review.py \
            "${{ github.event.pull_request.number }}" pr_review.md

      - name: Upload interactive viewer
        uses: actions/upload-artifact@v4
        with:
          name: semantic-review-viewer
          path: pr_review.html

      - name: Gate — fail if this PR introduces an invariant violation
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("pr_review.json"))
          v = [f for f in d.get("invariants", []) if f["kind"] in ("NEW VIOLATION", "WEAKENING")]
          for f in v:
              print(f"::error::{f['kind']} — {f['stmt']}")
          sys.exit(1 if v else 0)
          PY
