[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-semantic-reviewer"
version = "0.3.0"
description = "Semantic PR Reviewer for Python Web Applications"
readme = "PYPI_README.md"
requires-python = ">=3.8"
license = { text = "Elastic-2.0" }
authors = [
    { name = "Ankush Singh Gandhi" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: Other/Proprietary License",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AnkushSinghGandhi/prism"
Repository = "https://github.com/AnkushSinghGandhi/prism"

[project.scripts]
prism = "cli:main"

[tool.setuptools]
py-modules = ["cli", "diff_pr", "serve", "gitutil", "enforce", "invariants", "deps", "digest"]
packages = ["web", "extractor", "ci"]
package-data = { "web" = ["app.html", "viewer.template.html"] }
