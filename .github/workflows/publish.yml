name: publish

# Publish to PyPI via Trusted Publishing (OIDC) when a GitHub release is published.
# No API token anywhere — PyPI verifies this workflow's identity. One-time setup on pypi.org:
# project → Publishing → add a trusted publisher (owner: AnkushSinghGandhi, repo: this repo,
# workflow: publish.yml).
on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
