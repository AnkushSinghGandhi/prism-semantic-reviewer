name: 'Prism Semantic Review'
description: 'Runs Prism semantic diff to detect behavioral changes in a PR'
branding:
  icon: 'shield'
  color: 'purple'
inputs:
  github_token:
    description: 'GitHub token to fetch PR data'
    required: true
    default: ${{ github.token }}
  fail_on:
    description: 'When to fail the build (violation, crit, or none)'
    required: false
    default: 'none'
  invariants:
    description: 'Path to invariants JSON file (optional)'
    required: false
outputs:
  review_markdown:
    description: 'Path to the generated markdown review'
    value: 'pr_review.md'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Prism
      shell: bash
      run: pip install prism-reviewer
      
    - name: Run Prism Review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        CMD="prism review ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY} --pr ${{ github.event.pull_request.number }}"
        if [ "${{ inputs.invariants }}" != "" ]; then
          CMD="$CMD --invariants ${{ inputs.invariants }}"
        fi
        if [ "${{ inputs.fail_on }}" != "none" ]; then
          CMD="$CMD --fail-on ${{ inputs.fail_on }}"
        fi
        eval $CMD
