name: 'Pryti Semantic Review'
description: 'Semantic diff of a PR — what changed, where to look, and whether it breaks your rules'
branding:
  icon: 'shield'
  color: 'purple'
inputs:
  github_token:
    description: 'GitHub token (for PR data + posting the comment)'
    required: true
    default: ${{ github.token }}
  fail_on:
    description: 'When to fail the build: violation, crit, or none'
    required: false
    default: 'none'
  invariants:
    description: 'Path to a confirmed invariants JSON file (optional)'
    required: false
  comment:
    description: 'Post the review as a sticky PR comment (true/false)'
    required: false
    default: 'true'
  inline:
    description: 'Also pin each finding as an inline review comment on the exact changed line (true/false)'
    required: false
    default: 'true'
  label:
    description: 'Apply one pryti:* triage label for the PR top severity (true/false; needs issues: write)'
    required: false
    default: 'true'
  scan_deps:
    description: 'Scan bumped dependencies for new capabilities via PyPI (true/false; off = ⚠ unresolved, no network)'
    required: false
    default: 'true'
  upload_sarif:
    description: 'Upload SARIF to GitHub code scanning (true/false). Needs GitHub Advanced Security on private repos; set false without it so the step does not fail and the check stays green.'
    required: false
    default: 'true'
outputs:
  review_markdown:
    description: 'Path to the generated markdown review'
    value: 'pr_review.md'
  review_sarif:
    description: 'Path to the generated SARIF file (GitHub code scanning)'
    value: 'pr_review.sarif'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Pryti
      shell: bash
      run: pip install "pryti-semantic-reviewer>=0.1.3"

    - name: Run Pryti review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PRYTI_SCAN_DEPS: ${{ inputs.scan_deps == 'false' && '0' || '1' }}
      run: |
        CMD="pryti review ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY} --pr ${{ github.event.pull_request.number }} --out pr_review.md --json pr_review.json --sarif pr_review.sarif"
        if [ -n "${{ inputs.invariants }}" ]; then CMD="$CMD --invariants ${{ inputs.invariants }}"; fi
        if [ "${{ inputs.fail_on }}" != "none" ]; then CMD="$CMD --fail-on ${{ inputs.fail_on }}"; fi
        echo "$CMD"; eval "$CMD"

    - name: Upload SARIF to code scanning
      # Needs `permissions: security-events: write` + GitHub Advanced Security (private repos).
      # Set `upload_sarif: false` without GHAS so this step is skipped and the check stays green.
      if: ${{ always() && inputs.upload_sarif == 'true' && hashFiles('pr_review.sarif') != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: pr_review.sarif
        category: pryti

    - name: Post sticky PR comment
      if: ${{ always() && inputs.comment == 'true' && hashFiles('pr_review.md') != '' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        POST_ARGS="${{ github.event.pull_request.number }} pr_review.md"
        EXTRA=""
        if [ "${{ inputs.inline }}" = "true" ]; then EXTRA="$EXTRA --inline"; fi
        if [ "${{ inputs.label }}" = "true" ]; then EXTRA="$EXTRA --label"; fi
        if [ -n "$EXTRA" ] && [ -f pr_review.json ]; then
          POST_ARGS="$POST_ARGS --json pr_review.json$EXTRA"
        fi
        python "${GITHUB_ACTION_PATH}/ci/post_review.py" $POST_ARGS \
          || echo "::warning::could not post comment — ensure the job has 'permissions: pull-requests: write, issues: write'"
