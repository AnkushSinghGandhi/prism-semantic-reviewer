# Render Blueprint — deploy Prism as a web service.
# In Render: New → Blueprint → point at this repo. Then set the secret env vars below.
services:
  - type: web
    name: prism
    runtime: docker
    plan: free            # free spins down when idle (cold start ~30–60s) and disk is ephemeral
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      # LOCK DOWN a public deploy — set at least a token (Render dashboard → Environment).
      - key: PRISM_TOKEN
        sync: false        # set a secret; UI is then reached at ?token=<value>
      - key: PRISM_ALLOWED_REPOS
        sync: false        # optional: comma-separated substrings of repos allowed to be reviewed
      - key: GITHUB_TOKEN
        sync: false        # optional: for private repos / GitHub API rate limits
      - key: PRISM_DEFAULT_REPO
        sync: false        # optional: pre-fill a repo/URL in the UI
      # Set to /prism ONLY if you serve it under domain.com/prism behind a proxy (see DEPLOY.md).
      - key: PRISM_BASE_PATH
        value: ""
